name: Astrid *
description: 'Astrid was a popular cross-platform social to-do list and task-management app (Todoroo, Inc.),
  known for its Android and web productivity service and a lightweight task-sync API. It was a GV (Google
  Ventures) portfolio company in the consumer sector. Yahoo acquired the Astrid team in May 2013 and
  discontinued the service later that year; the astrid.com domain now resolves to Yahoo and the original
  developer surface (apidoc / api_keys) is dead. The Android client was open-sourced (todoroo/astrid) and
  later revived by the community as tasks.org (tasks/tasks). No live first-party API, developer portal, or
  documentation exists to enrich. This profile is retained as a historical/defunct portfolio lead.'
